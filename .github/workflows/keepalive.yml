name: Keep Render Server Warm & Awake

on:
  schedule:
    # Run every 10 minutes to prevent Render free-tier from entering sleep mode
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Goldilocks Backend
        run: |
          echo "Sending keep-alive ping to Goldilocks Render service..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}\n" -m 45 "https://goldilocks-cake-all-you-can.onrender.com/api/ping")
          echo "$RESPONSE"
          echo "Server ping completed successfully."
